<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bezier 3</title>
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="fav.svg">
  
  <style>
    /* --- PERFECT RESET --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }
    
    /* --- MAIN CONTAINER --- */
    #main-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: 20px;
      gap: 8px;
    }
    
    /* --- TITLE (CENTER TOP) --- */
    .title-bar {
      text-align: center;
      flex-shrink: 0;
      padding: 2px 0;
      width: 100%;
    }
    .title-bar .title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 8px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
    }
    .title-bar .title .accent {
      color: #c9a84c;
      font-weight: 400;
    }
    
    /* --- CANVAS CONTAINER --- */
    #canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 0;
      padding: 0 10px;
      position: relative;
      cursor: pointer;
    }
    
    canvas {
      display: block;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      image-rendering: auto;
      touch-action: none;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      transition: opacity 0.6s ease, transform 0.6s ease;
      background: #0a0a0a;
    }
    
    /* --- SHIRT MOCKUP --- */
    #shirt-mockup {
      display: none;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    #shirt-mockup.active {
      display: block;
      animation: fadeIn 0.6s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    canvas.hidden {
      display: none;
    }
    
    /* --- BOTTOM BAR --- */
    .bottom-bar {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 6px;
      padding: 4px 0;
    }
    
    /* --- CONTROLS --- */
    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    
    .controls {
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.04);
      padding: 8px 20px;
      border-radius: 30px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.3s ease;
      letter-spacing: 0.8px;
      touch-action: manipulation;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .controls:hover {
      color: rgba(255,255,255,0.95);
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
    }
    .controls:active {
      transform: scale(0.95);
    }
    .controls .key {
      color: rgba(255,255,255,0.5);
      font-weight: 300;
    }
    .controls .sep {
      color: rgba(255,255,255,0.15);
      margin: 0 4px;
    }
    
    /* --- SHIRT BUTTON --- */
    .controls.shirt-btn {
      border-color: rgba(201, 168, 76, 0.2);
      color: rgba(201, 168, 76, 0.7);
      letter-spacing: 1px;
    }
    .controls.shirt-btn:hover {
      border-color: rgba(201, 168, 76, 0.4);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.06);
    }
    .controls.shirt-btn.active {
      border-color: rgba(201, 168, 76, 0.5);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
    }
    .controls.shirt-btn .icon {
      font-size: 14px;
      line-height: 1;
    }
    
    /* --- INFO ROW --- */
    .info-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      color: rgba(255,255,255,0.3);
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      font-size: 9px;
      letter-spacing: 0.5px;
      flex-wrap: wrap;
      padding: 2px 0;
    }
    .info-row .info-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.02);
    }
    .info-row .label {
      color: rgba(255,255,255,0.25);
      font-weight: 300;
    }
    .info-row .value {
      color: rgba(255,255,255,0.6);
      font-weight: 400;
    }
    
    /* --- DESCRIPTION --- */
    .description {
      display: block;
      text-align: center;
      color: rgba(255,255,255,0.25);
      font-size: 8px;
      letter-spacing: 1.2px;
      line-height: 1.8;
      padding: 2px 10px;
      font-weight: 300;
      max-width: 500px;
      width: 100%;
      text-transform: uppercase;
    }
    .description .highlight {
      color: rgba(255,255,255,0.4);
    }
    .description .sep {
      color: rgba(255,255,255,0.08);
      margin: 0 4px;
    }
    
    /* ============================================
       RESPONSIVE
    ============================================ */
    
    @media (max-width: 1024px) {
      #main-container { padding: 16px; gap: 6px; }
      .title-bar .title { font-size: 20px; letter-spacing: 6px; }
      .controls { font-size: 10px; padding: 7px 16px; min-height: 34px; }
      .info-row { font-size: 8.5px; gap: 12px; }
      .info-row .info-item { padding: 2px 10px; }
      .description { font-size: 7.5px; letter-spacing: 1px; }
    }
    
    @media (max-width: 768px) {
      #main-container { padding: 12px; gap: 5px; }
      .title-bar .title { font-size: 17px; letter-spacing: 5px; }
      #canvas-container { padding: 0 6px; }
      .controls { font-size: 9px; padding: 6px 14px; min-height: 32px; letter-spacing: 0.6px; }
      .controls-row { gap: 6px; }
      .info-row { font-size: 8px; gap: 10px; }
      .info-row .info-item { padding: 2px 8px; }
      .description { font-size: 7px; letter-spacing: 0.8px; padding: 2px 6px; }
      .controls.shirt-btn .icon { font-size: 12px; }
    }
    
    @media (max-width: 480px) {
      #main-container { padding: 8px; gap: 4px; }
      .title-bar .title { font-size: 14px; letter-spacing: 4px; }
      #canvas-container { padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; border-radius: 24px; letter-spacing: 0.4px; }
      .controls-row { gap: 4px; }
      .info-row { font-size: 7px; gap: 8px; }
      .info-row .info-item { padding: 2px 6px; gap: 4px; }
      .description { font-size: 6.5px; letter-spacing: 0.6px; padding: 2px 4px; line-height: 1.6; }
      .controls.shirt-btn .icon { font-size: 11px; }
    }
    
    @media (max-width: 380px) {
      #main-container { padding: 6px; gap: 3px; }
      .title-bar .title { font-size: 12px; letter-spacing: 3px; }
      #canvas-container { padding: 0 2px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 26px; border-radius: 20px; }
      .info-row { font-size: 6.5px; gap: 6px; }
      .info-row .info-item { padding: 1px 5px; border-radius: 14px; }
      .description { font-size: 6px; letter-spacing: 0.5px; padding: 1px 3px; }
      .controls.shirt-btn .icon { font-size: 10px; }
    }
    
    @media (orientation: landscape) and (max-height: 500px) {
      #main-container { padding: 10px 20px; gap: 4px; flex-direction: row; flex-wrap: wrap; }
      .title-bar { width: 100%; flex-shrink: 0; }
      .title-bar .title { font-size: 16px; letter-spacing: 4px; }
      #canvas-container { flex: 1; min-height: 0; height: 100%; padding: 0 8px; }
      .bottom-bar { width: auto; max-width: 180px; flex-shrink: 0; gap: 4px; padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; letter-spacing: 0.4px; }
      .controls-row { flex-direction: column; gap: 4px; }
      .info-row { font-size: 7px; gap: 6px; flex-direction: column; align-items: stretch; }
      .info-row .info-item { padding: 2px 8px; justify-content: center; }
      .description { font-size: 6px; max-width: 160px; padding: 1px 4px; line-height: 1.4; letter-spacing: 0.5px; }
    }
    
    @media (orientation: landscape) and (max-height: 380px) {
      #main-container { padding: 6px 12px; gap: 3px; }
      .title-bar .title { font-size: 13px; letter-spacing: 3px; }
      #canvas-container { padding: 0 4px; }
      .bottom-bar { max-width: 140px; gap: 3px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 24px; border-radius: 16px; }
      .info-row { font-size: 6px; gap: 4px; }
      .info-row .info-item { padding: 1px 6px; }
      .description { font-size: 5.5px; max-width: 120px; padding: 1px 3px; }
    }
    
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
      canvas { image-rendering: auto; }
    }
    
    @supports (-webkit-touch-callout: none) {
      .controls { min-height: 40px; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .controls, canvas, #shirt-mockup { transition: none; }
      #shirt-mockup.active { animation: none; }
    }
  </style>
</head>
<body>

<!-- MAIN CONTAINER -->
<div id="main-container">

  <!-- TITLE (CENTER TOP) -->
  <div class="title-bar">
    <div class="title"><span class="accent">Bezier</span> 3</div>
  </div>

  <!-- CANVAS CONTAINER -->
  <div id="canvas-container">
    <canvas id="target"></canvas>
    <img id="shirt-mockup" src="Bezier-3.jpg" alt="Bezier 3 on T-Shirt" />
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">

    <!-- CONTROLS ROW -->
    <div class="controls-row">
      <div class="controls" id="controlsBar">
        <span class="key">●</span> regenerate <span class="sep">—</span> <span class="key">S</span> save
      </div>
      <div class="controls shirt-btn" id="shirtToggle">
        <span class="icon">◷</span> apparel
      </div>
    </div>

    <!-- INFO ROW -->
    <div class="info-row">
      <div class="info-item">
        <span class="label">seed</span>
        <span class="value" id="seedDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">points</span>
        <span class="value" id="pointsDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">links</span>
        <span class="value" id="linksDisplay">---</span>
      </div>
    </div>

    <!-- DESCRIPTION -->
    <div class="description">
      <span class="highlight">graph networks</span>
      <span class="sep">·</span>
      <span class="highlight">click to add</span>
      <span class="sep">·</span>
      <span class="highlight">bouncing points</span>
      <span class="sep">·</span>
      <span class="highlight">seed-based</span>
    </div>

  </div>

</div>

<script>
// ============================================
// BEZIER 3 — PURE JS MINIMAL T-SHIRT EDITION
// ============================================

// --- DETERMINISTIC RANDOM GENERATOR ---
class RandomGenerator {
  constructor(seed) {
    this.seed = seed;
    this.state = seed;
  }
  rand() {
    let x = this.state;
    x ^= x << 13;
    x ^= x >> 17;
    x ^= x << 5;
    this.state = x;
    return (x >>> 0) / 4294967296;
  }
}

// --- STATE ---
const ratio = 1 / 1;
const prefix = 'Bezier 3';
const features = {};
let seed = Date.now() + Math.random() * 1000000;
let rng = new RandomGenerator(seed);
let showingShirt = false;
let resizeTmr = null;
let animationFrame = null;
let isAnimating = true;

// --- CANVAS VARIABLES ---
let canvasSize = 600;
let GraphMat = [];
let Points = [];
let diameters = 10;
let velocities = [];

// --- URL PARAMS ---
const urlSearchParams = new URLSearchParams(window.location.search);
const urlParams = Object.fromEntries(urlSearchParams.entries());

// --- COLOR ARRAYS ---
const Backgroundcolors = [
  '#000000', '#34282C', '#3A3B3C', '#52595D', '#888B90', '#B6B6B6', '#C0C0C0', '#98AFC7',
  '#2F539B', '#2916F5', '#1F45FC', '#1589FF', '#14A3C7', '#6495ED', '#00BFFF', '#9AFEFF',
  '#16E2F5', '#81D8D0', '#01F9C6', '#3EA99F', '#045F5F', '#033E3E', '#2C3539', '#307D7E',
  '#006A4E', '#1AA260', '#22CE83', '#728C00', '#808000', '#08A04B', '#228B22', '#12AD2B',
  '#52D017', '#A0D6B4', '#16F529', '#00FF00', '#E2F516', '#E3F9A6', '#F3E5AB', '#FFEF00',
  '#FFD700', '#F6BE00', '#FFA600', '#CA762B', '#C68E17', '#966F33', '#513B1C', '#622F22',
  '#43302E', '#B83C08', '#EB5406', '#FF6700', '#FF8040', '#FF8674', '#FD1C03', '#E41B17',
  '#B21807', '#931314', '#550A35', '#7D0541', '#F8B88B', '#E75480', '#F660AB', '#F52887',
  '#FA2A55', '#DC143C', '#FF00FF', '#DCD0FF', '#C8A2C8', '#FFF9E3', '#FFFAF0'
];

// --- SETUP ---
function setup() {
  const BackgroundIndex1 = Math.floor(rng.rand() * Backgroundcolors.length);
  const BackgroundIndex2 = Math.floor(rng.rand() * Backgroundcolors.length);

  features.backgroundColour1 = Backgroundcolors[BackgroundIndex1];
  features.backgroundColour2 = Backgroundcolors[BackgroundIndex2];
  features.numberOfstartPoint = Math.floor(rng.rand() * 12) + 3;
  features.minimumNumlink = Math.floor(rng.rand() * (features.numberOfstartPoint - 1));
  features.boundaryBuffer = canvasSize / (rng.rand() * 20 + 10);

  GraphMat = generateSymmetricGraphMatrix(features.numberOfstartPoint, features.minimumNumlink);
  Points = generateRandomPoints(features.numberOfstartPoint, canvasSize, canvasSize, features.boundaryBuffer);

  diameters = canvasSize / (rng.rand() * 80 + 20);
  features.balldiameter = diameters;

  // Initialize velocities
  velocities = Points.map(() => ({ vx: rng.rand() * 2 - 1, vy: rng.rand() * 2 - 1 }));
}

// --- HELPER FUNCTIONS ---
function generateSymmetricGraphMatrix(n, m) {
  function getRandomInt(max) {
    return Math.floor(rng.rand() * max);
  }

  const matrix = Array.from({ length: n }, () => Array(n).fill(0));

  for (let i = 0; i < n; i++) {
    let indices = new Set();

    while (indices.size < m) {
      const randomIndex = getRandomInt(n);
      if (randomIndex !== i) {
        indices.add(randomIndex);
        matrix[i][randomIndex] = 1;
        matrix[randomIndex][i] = 1;
      }
    }
  }

  return matrix;
}

function generateRandomPoints(numPoints, width, height, boundaryBuffer) {
  const points = [];

  for (let i = 0; i < numPoints; i++) {
    const x = rng.rand() * (width - 2 * boundaryBuffer) + boundaryBuffer;
    const y = rng.rand() * (height - 2 * boundaryBuffer) + boundaryBuffer;
    points.push({
      x: x,
      y: y,
      color: '#FFFFFF',
      touched: false
    });
  }

  return points;
}

function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? {
    r: parseInt(result[1], 16),
    g: parseInt(result[2], 16),
    b: parseInt(result[3], 16)
  } : { r: 0, g: 0, b: 0 };
}

function diagonalGradientRect(ctx, x, y, w, h, c1, c2) {
  const maxDist = Math.sqrt(w * w + h * h);
  const step = Math.max(Math.min(w, h) / 100, 1);

  const c1Rgb = hexToRgb(c1);
  const c2Rgb = hexToRgb(c2);

  for (let i = 0; i <= w; i += step) {
    for (let j = 0; j <= h; j += step) {
      const distToStart = Math.sqrt(i * i + j * j);
      const inter = maxDist !== 0 ? Math.min(distToStart / maxDist, 1) : 0;
      
      const r = Math.round(c1Rgb.r + (c2Rgb.r - c1Rgb.r) * inter);
      const g = Math.round(c1Rgb.g + (c2Rgb.g - c1Rgb.g) * inter);
      const b = Math.round(c1Rgb.b + (c2Rgb.b - c1Rgb.b) * inter);
      
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      ctx.fillRect(x + i, y + j, Math.min(step, w - i), Math.min(step, h - j));
    }
  }
}

function drawGraph(ctx, matrix, pts, canvasWidth, radius) {
  const maxDist = canvasWidth * Math.sqrt(2);

  // Draw lines
  for (let i = 0; i < matrix.length; i++) {
    for (let j = i + 1; j < matrix[i].length; j++) {
      if (matrix[i][j] === 1) {
        const point1 = pts[i];
        const point2 = pts[j];
        const d = Math.sqrt(Math.pow(point1.x - point2.x, 2) + Math.pow(point1.y - point2.y, 2));

        const inter = maxDist !== 0 ? Math.min(d / maxDist, 1) : 0;
        const gray = Math.round(255 - inter * 255);
        ctx.strokeStyle = 'rgb(' + gray + ',' + gray + ',' + gray + ')';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(point1.x, point1.y);
        ctx.lineTo(point2.x, point2.y);
        ctx.stroke();
      }
    }
  }

  // Draw points
  pts.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.shadowColor = pt.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, radius / 2, 0, 2 * Math.PI);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
  });
}

function movePoints(points, radius, rangeX, rangeY, canvasWidth, canvasHeight, boundaryBuffer, velocities) {
  const minDistance = radius;

  points.forEach((point, index) => {
    const velocity = velocities[index];

    const movementX = velocity.vx * rangeX;
    const movementY = velocity.vy * rangeY;

    point.x += movementX;
    point.y += movementY;

    if (point.x < boundaryBuffer || point.x > canvasWidth - boundaryBuffer) {
      velocity.vx = -velocity.vx;
      point.x = Math.min(Math.max(point.x, boundaryBuffer), canvasWidth - boundaryBuffer);
    }

    if (point.y < boundaryBuffer || point.y > canvasHeight - boundaryBuffer) {
      velocity.vy = -velocity.vy;
      point.y = Math.min(Math.max(point.y, boundaryBuffer), canvasHeight - boundaryBuffer);
    }

    velocity.vx += (rng.rand() * 2 - 1) * 0.05;
    velocity.vy += (rng.rand() * 2 - 1) * 0.05;

    const magnitude = Math.sqrt(velocity.vx ** 2 + velocity.vy ** 2);
    if (magnitude > 1) {
      velocity.vx /= magnitude;
      velocity.vy /= magnitude;
    }

    points.forEach((otherPoint, otherIndex) => {
      if (index === otherIndex) return;

      const dx = otherPoint.x - point.x;
      const dy = otherPoint.y - point.y;
      const distance = Math.sqrt(dx ** 2 + dy ** 2);

      if (distance <= minDistance) {
        const tempVx = velocity.vx;
        const tempVy = velocity.vy;

        velocity.vx = velocities[otherIndex].vx;
        velocity.vy = velocities[otherIndex].vy;

        velocities[otherIndex].vx = tempVx;
        velocities[otherIndex].vy = tempVy;

        point.color = point.color === '#FFFFFF' ? '#000000' : '#FFFFFF';
        otherPoint.color = otherPoint.color === '#FFFFFF' ? '#000000' : '#FFFFFF';

        point.touched = true;
        otherPoint.touched = true;
      } else {
        if (!point.touched) point.color = '#FFFFFF';
        if (!otherPoint.touched) otherPoint.color = '#FFFFFF';
      }
    });

    point.touched = point.touched && points.some(otherPoint => 
      Math.sqrt(Math.pow(point.x - otherPoint.x, 2) + Math.pow(point.y - otherPoint.y, 2)) < minDistance
    );
  });

  return { points, velocities };
}

// --- INTERACTIVE: ADD POINT ON CLICK ---
function addPoint(x, y) {
  const canvas = document.getElementById('target');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  
  const canvasX = (x - rect.left) * scaleX;
  const canvasY = (y - rect.top) * scaleY;

  // Add new point
  const newPoint = { x: canvasX, y: canvasY, color: '#FFFFFF', touched: false };
  const newIndex = Points.length;
  Points.push(newPoint);

  // Add column and row to matrix
  GraphMat.forEach(row => row.push(0));
  GraphMat.push(Array(Points.length).fill(0));

  // Connect to random subset of existing points
  const minLinks = features.minimumNumlink || 1;
  const maxLinks = Math.min(Points.length - 1, features.numberOfstartPoint + 2);
  const numConnections = Math.floor(rng.rand() * (maxLinks - minLinks + 1)) + minLinks;
  
  const existingIndices = Array.from({ length: Points.length - 1 }, (_, i) => i);
  // Shuffle array
  for (let i = existingIndices.length - 1; i > 0; i--) {
    const j = Math.floor(rng.rand() * (i + 1));
    [existingIndices[i], existingIndices[j]] = [existingIndices[j], existingIndices[i]];
  }

  for (let i = 0; i < numConnections && i < existingIndices.length; i++) {
    const idx = existingIndices[i];
    GraphMat[idx][newIndex] = 1;
    GraphMat[newIndex][idx] = 1;
  }

  // Initialize velocity for new point
  velocities.push({ vx: rng.rand() * 2 - 1, vy: rng.rand() * 2 - 1 });

  // Update UI
  updateUI();
}

// --- MAIN DRAW ---
function drawCanvas() {
  if (animationFrame) {
    cancelAnimationFrame(animationFrame);
  }

  const canvas = document.getElementById('target');
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  canvasSize = Math.min(w, h);

  // Draw gradient background
  diagonalGradientRect(ctx, 0, 0, w, h, features.backgroundColour1, features.backgroundColour2);

  // Draw graph
  drawGraph(ctx, GraphMat, Points, w, diameters);

  // Move points
  const result = movePoints(Points, diameters, diameters/4, diameters/4, w, h, features.boundaryBuffer * (w / canvasSize), velocities);
  Points = result.points;
  velocities = result.velocities;

  updateUI();

  if (isAnimating) {
    animationFrame = requestAnimationFrame(drawCanvas);
  }
}

// --- UPDATE UI ---
function updateUI() {
  document.getElementById('seedDisplay').textContent = String(seed).slice(0, 8);
  document.getElementById('pointsDisplay').textContent = Points.length || '---';
  
  // Count links
  let linkCount = 0;
  for (let i = 0; i < GraphMat.length; i++) {
    for (let j = i + 1; j < GraphMat[i].length; j++) {
      if (GraphMat[i][j] === 1) linkCount++;
    }
  }
  document.getElementById('linksDisplay').textContent = linkCount || '---';
}

// --- REGENERATE ---
function regenerate() {
  seed = Date.now() + Math.random() * 1000000;
  rng = new RandomGenerator(seed);
  
  setup();
  
  if (showingShirt) {
    toggleShirt();
  }
  
  isAnimating = true;
  if (animationFrame) {
    cancelAnimationFrame(animationFrame);
  }
  
  layoutCanvas();
}

// --- TOGGLE SHIRT ---
function toggleShirt() {
  showingShirt = !showingShirt;
  const canvas = document.getElementById('target');
  const shirtMockup = document.getElementById('shirt-mockup');
  const shirtToggle = document.getElementById('shirtToggle');
  
  if (showingShirt) {
    canvas.classList.add('hidden');
    shirtMockup.classList.add('active');
    shirtToggle.classList.add('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> artwork';
    isAnimating = false;
    if (animationFrame) {
      cancelAnimationFrame(animationFrame);
    }
  } else {
    canvas.classList.remove('hidden');
    shirtMockup.classList.remove('active');
    shirtToggle.classList.remove('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> apparel';
    isAnimating = true;
    drawCanvas();
  }
}

// --- SAVE ---
function saveImage() {
  const canvas = document.getElementById('target');
  const link = document.createElement('a');
  const seedStr = String(seed).slice(0, 8);
  link.download = prefix + '_Seed' + seedStr + '.png';
  
  if (showingShirt) {
    link.href = document.getElementById('shirt-mockup').src;
  } else {
    link.href = canvas.toDataURL('image/png', 1.0);
  }
  link.click();
}

// --- LAYOUT CANVAS ---
function layoutCanvas() {
  if (animationFrame) {
    cancelAnimationFrame(animationFrame);
  }
  
  const container = document.getElementById('canvas-container');
  const containerRect = container.getBoundingClientRect();
  let maxWidth = containerRect.width;
  let maxHeight = containerRect.height;
  
  maxWidth = Math.max(maxWidth, 80);
  maxHeight = Math.max(maxHeight, 80);
  
  let cWidth = maxWidth;
  let cHeight = cWidth / ratio;
  
  if (cHeight > maxHeight) {
    cHeight = maxHeight;
    cWidth = maxHeight * ratio;
  }
  
  cWidth = Math.max(cWidth, 80);
  cHeight = Math.max(cHeight, 80);
  
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  
  let targetWidth = cWidth * dpr;
  let targetHeight = cHeight * dpr;
  
  if ('forceWidth' in urlParams) {
    targetWidth = parseInt(urlParams.forceWidth);
    targetHeight = Math.floor(targetWidth / ratio);
    dpr = 1;
  }
  
  const canvas = document.getElementById('target');
  canvas.width = targetWidth;
  canvas.height = targetHeight;
  canvas.style.width = cWidth + 'px';
  canvas.style.height = cHeight + 'px';
  
  const shirtMockup = document.getElementById('shirt-mockup');
  shirtMockup.style.width = cWidth + 'px';
  shirtMockup.style.height = cHeight + 'px';
  
  canvasSize = Math.min(targetWidth, targetHeight);
  
  // Recalculate with new size
  setup();
  
  drawCanvas();
}

// --- RESIZE ---
function handleResize() {
  clearTimeout(resizeTmr);
  resizeTmr = setTimeout(() => {
    layoutCanvas();
  }, 100);
}

// --- KEYBOARD ---
document.addEventListener('keydown', function(e) {
  if (e.key === 's' || e.key === 'S') {
    e.preventDefault();
    saveImage();
  }
  if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    regenerate();
  }
  if (e.key === 't' || e.key === 'T') {
    e.preventDefault();
    toggleShirt();
  }
});

// --- CONTROLS ---
document.getElementById('controlsBar').addEventListener('click', regenerate);
document.getElementById('controlsBar').addEventListener('touchend', function(e) {
  e.preventDefault();
  regenerate();
});

document.getElementById('shirtToggle').addEventListener('click', toggleShirt);
document.getElementById('shirtToggle').addEventListener('touchend', function(e) {
  e.preventDefault();
  toggleShirt();
});

// --- CANVAS CLICK ---
document.getElementById('canvas-container').addEventListener('click', function(e) {
  if (!showingShirt) {
    addPoint(e.clientX, e.clientY);
  }
});

document.getElementById('canvas-container').addEventListener('touchend', function(e) {
  if (!showingShirt) {
    const touch = e.changedTouches[0];
    addPoint(touch.clientX, touch.clientY);
    e.preventDefault();
  }
});

// --- WINDOW ---
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', function() {
  setTimeout(handleResize, 400);
});

// --- VISIBILITY ---
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    setTimeout(() => {
      if (!showingShirt && isAnimating) {
        drawCanvas();
      }
    }, 100);
  }
});

// --- INIT ---
function init() {
  setup();
  layoutCanvas();
  updateUI();
  
  console.log('Bezier 3 — Pure JS Minimal T-Shirt Edition');
  console.log('◷ Press T to toggle apparel view');
  console.log('Press S to save');
  console.log('Press R to regenerate');
  console.log('Click on canvas to add points');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

window.regenerate = regenerate;
window.saveImage = saveImage;
window.toggleShirt = toggleShirt;
window.drawCanvas = drawCanvas;
window.layoutCanvas = layoutCanvas;
window.addPoint = addPoint;
</script>
</body>
</html>
